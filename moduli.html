    <style>
        @media only screen and (max-width: 850px) {
            /* Forza le tabelle a occupare tutto lo schermo */
            table[width="75%"], table { width: 100% !important; table-layout: auto !important; }

                height: auto !important; 
                max-width: 85% !important; 
                margin: 10px auto !important;
                display: block;
            }

            /* Menu: Pulsanti larghi e facili da cliccare */
            td[width="200"] { padding: 10px !important; }
            td[width="200"] table { width: 100% !important; }
            
            /* Contenuto: Rimuove lo sfondo pesante e aggiunge aria al testo */
            td[width="80%"] { 
                background-image: none !important; 
                padding: 20px !important;
                background-color: #FFFFFF;
            }

            /* Immagini: le incolonna sotto al testo */
            td[width="60%"], td[width="40%"] { 
                width: 100% !important; 
                text-align: center !important;
            }
            
            img { 
                max-width: 100% !important; 
                height: auto !important; 
                margin-bottom: 20px !important;
                border-radius: 8px;
            }
            
            h1 { font-size: 1.6em !important; text-align: center; }
        }
    </style>
